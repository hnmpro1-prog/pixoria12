<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixoria - Image Compressor & Resizer</title>
<style>
:root{--ink:#1f2340;--mut:#6b7090;--card:#ffffff;--line:#e8eaf6;--coral:#ff6b6b;--amber:#ffb020;--teal:#14b8a6;--indigo:#6366f1;--violet:#a855f7}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;min-height:100%}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(160deg,#eef4ff 0%,#f7eefe 45%,#e9fbf7 100%);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.app{max-width:1080px;margin:0 auto;padding:28px 18px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--coral),var(--amber) 35%,var(--teal) 70%,var(--indigo));box-shadow:0 8px 20px rgba(99,102,241,.35)}
.brand h1{margin:0;font-size:1.6rem;font-weight:900;letter-spacing:-.4px}
.brand h1 span{background:linear-gradient(90deg,var(--indigo),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{color:var(--mut);font-weight:600;font-size:.95rem;margin:0}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.msg{margin-top:12px;padding:12px 14px;border-radius:14px;background:#fff1f1;color:#b42318;font-weight:700;font-size:.92rem}
.drop{display:block;background:var(--card);border-radius:24px;padding:38px 20px;text-align:center;cursor:pointer;border:2px dashed #c7c9f2;box-shadow:0 12px 34px rgba(99,102,241,.10);transition:transform .2s,border-color .2s,background .2s}
.drop:hover,.drop.over{transform:translateY(-2px);border-color:var(--indigo);background:#fbfbff}
.drop .icon{width:64px;height:64px;margin:0 auto 12px;border-radius:20px;background:linear-gradient(135deg,var(--coral),var(--amber));display:grid;place-items:center;color:#fff;font-size:30px;font-weight:900;box-shadow:0 10px 24px rgba(255,107,107,.35)}
.drop h2{margin:0 0 6px;font-size:1.3rem}
.drop p{margin:0;color:var(--mut);font-weight:600}
.strip{display:flex;gap:10px;overflow-x:auto;padding:14px 4px 4px;-webkit-overflow-scrolling:touch}
.th{flex:0 0 auto;width:68px;height:68px;border-radius:14px;border:0;padding:0;overflow:hidden;cursor:pointer;background:#fff;box-shadow:0 4px 12px rgba(31,35,64,.10);outline:3px solid transparent;transition:transform .2s,outline-color .2s}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.on{outline-color:var(--indigo);transform:translateY(-2px)}
.layout{display:grid;grid-template-columns:1fr 330px;gap:20px;margin-top:14px;align-items:start}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 12px 34px rgba(31,35,64,.08)}
.compare{position:relative;width:100%;aspect-ratio:4/3;max-height:62vh;border-radius:16px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ew-resize;background:#f5f6fc;background-image:linear-gradient(45deg,#eceef9 25%,transparent 25%),linear-gradient(-45deg,#eceef9 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eceef9 75%),linear-gradient(-45deg,transparent 75%,#eceef9 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
#imgResult{clip-path:inset(0 0 0 50%)}
.handle{position:absolute;top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 12px rgba(0,0,0,.25)}
.handle::after{content:"\2194";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--violet));color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800;box-shadow:0 6px 18px rgba(99,102,241,.45)}
.tag{position:absolute;top:12px;padding:5px 11px;border-radius:99px;font-size:.78rem;font-weight:800;color:#fff;pointer-events:none}
.tag.l{left:12px;background:var(--coral)}
.tag.r{right:12px;background:var(--teal)}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.7);font-weight:800;color:var(--indigo)}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--mut);font-size:.84rem;margin-top:10px;flex-wrap:wrap;font-weight:600}
.side{display:grid;gap:14px;align-content:start}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:16px;padding:12px 14px;color:#fff}
.stat small{display:block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;opacity:.92}
.stat b{font-size:1.15rem}
.s1{background:linear-gradient(135deg,var(--coral),#ff8e72)}
.s2{background:linear-gradient(135deg,var(--indigo),var(--violet))}
.s3{grid-column:1/-1;background:linear-gradient(90deg,var(--teal),#06b6d4);text-align:center}
.s3 b{font-size:2rem;display:block}
.bar{height:10px;border-radius:99px;background:#eef0fb;overflow:hidden}
.bar span{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--indigo));transition:width .4s ease}
.sec{background:#f8f9ff;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
.lbl{font-size:.82rem;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.pill{background:#fff3d1;color:#7a4f00;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:800}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#e9ecfb;border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:9px 4px;border-radius:9px;font:inherit;font-weight:800;color:var(--mut);cursor:pointer;min-height:42px}
.seg button.on{background:linear-gradient(90deg,var(--indigo),var(--violet));color:#fff;box-shadow:0 5px 14px rgba(99,102,241,.35)}
.seg.fmt button.on{background:linear-gradient(90deg,var(--coral),var(--amber));box-shadow:0 5px 14px rgba(255,107,107,.3)}
input[type=range]{width:100%;accent-color:var(--indigo);margin:2px 0;min-height:32px}
.px{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.px input[type=number]{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-weight:700;color:var(--ink);background:#fff;min-height:44px;font-size:16px}
.px input:focus{outline:none;border-color:var(--indigo)}
.px span{color:var(--mut);font-weight:800}
.lock{display:flex;align-items:center;gap:8px;font-size:.84rem;font-weight:700;color:var(--mut);cursor:pointer}
.lock input{width:18px;height:18px;accent-color:var(--indigo)}
.dl{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:16px;background:linear-gradient(90deg,var(--coral),var(--amber) 50%,var(--teal));color:#fff;text-decoration:none;font-weight:900;font-size:1.05rem;box-shadow:0 10px 24px rgba(255,107,107,.3);transition:transform .15s}
.dl:hover{transform:translateY(-2px)}
.note{font-size:.78rem;color:var(--mut);text-align:center;margin:0;font-weight:600}
footer{text-align:center;color:var(--mut);font-size:.82rem;margin-top:26px;font-weight:600}
@media (max-width:860px){.layout{grid-template-columns:1fr;gap:14px}.compare{max-height:none}}
@media (max-width:640px){
  .app{padding:18px 12px 30px}
  .drop{padding:26px 14px;border-radius:20px}
  .drop .icon{width:54px;height:54px;font-size:26px}
  .card{padding:12px;border-radius:20px}
  .th{width:58px;height:58px;border-radius:12px}
  .stat b{font-size:1.02rem}
  .s3 b{font-size:1.7rem}
  .seg button{font-size:.92rem}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="mark"></div>
      <div>
        <h1>Pixo<span>ria</span></h1>
        <p class="tagline">Compress and resize images, right in your browser.</p>
      </div>
    </div>
  </header>

  <label id="drop" class="drop" for="file" tabindex="0">
    <div class="icon">+</div>
    <h2>Drop your image here</h2>
    <p>or click to browse · JPG, PNG, WebP · multiple files supported</p>
    <input id="file" class="sr" type="file" accept="image/*" multiple>
  </label>
  <div id="msg" class="msg" hidden></div>

  <div id="strip" class="strip"></div>

  <section id="ws" hidden>
    <div class="layout">
      <div class="card">
        <div id="cmp" class="compare">
          <img id="imgOriginal" alt="Original image">
          <img id="imgResult" alt="Result image">
          <div id="handle" class="handle"></div>
          <span class="tag l">Original</span>
          <span class="tag r">Result</span>
          <div id="busy" class="busy" hidden>Processing…</div>
        </div>
        <div class="meta"><span id="dims"></span><span>Drag the divider to compare</span></div>
      </div>

      <aside class="side card">
        <div class="stats">
          <div class="stat s1"><small>Original</small><b id="sOrig">-</b></div>
          <div class="stat s2"><small>New size</small><b id="sNew">-</b></div>
          <div class="stat s3"><small>Saved</small><b id="sSaved">0%</b></div>
        </div>
        <div class="bar"><span id="bar"></span></div>

        <div class="sec">
          <div class="lbl">Resize <span class="pill" id="scaleLbl">100%</span></div>
          <div class="seg" id="modeSeg">
            <button data-m="pct" class="on">Percent</button>
            <button data-m="px">Pixels</button>
          </div>
          <div id="pctBox">
            <input id="scale" type="range" min="10" max="200" value="100">
          </div>
          <div id="pxBox" hidden>
            <div class="px">
              <input id="inW" type="number" min="1" placeholder="Width">
              <span>×</span>
              <input id="inH" type="number" min="1" placeholder="Height">
            </div>
            <label class="lock"><input id="lock" type="checkbox" checked> Keep aspect ratio</label>
          </div>
        </div>

        <div class="sec">
          <div class="lbl">Quality <span class="pill" id="qv">80</span></div>
          <input id="q" type="range" min="10" max="100" value="80">
          <div class="lbl">Format</div>
          <div class="seg fmt" id="fmtSeg">
            <button data-f="image/jpeg">JPG</button>
            <button data-f="image/webp" class="on">WebP</button>
            <button data-f="image/png">PNG</button>
          </div>
        </div>

        <a id="dl" class="dl" href="#" download>Download</a>
        <p class="note">Processed locally in your browser. Nothing is uploaded.</p>
      </aside>
    </div>
  </section>

  <footer>Pixoria · fast, private, and free</footer>
</div>

<script>
const $ = s => document.querySelector(s);
const drop = $('#drop'), file = $('#file'), strip = $('#strip'), ws = $('#ws');
const busy = $('#busy'), cmp = $('#cmp'), handle = $('#handle'), imgResult = $('#imgResult');
const scale = $('#scale'), inW = $('#inW'), inH = $('#inH'), lock = $('#lock'), q = $('#q');
const EXT = {'image/jpeg':'jpg','image/webp':'webp','image/png':'png'};
let items = [], cur = null, fmt = 'image/webp', mode = 'pct', timer = null;

drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } });
file.addEventListener('change', e => add(e.target.files));
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => add(e.dataTransfer.files));

function fb(b) { return b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(2) + ' MB'; }

function showMsg(t) { const m = $('#msg'); m.textContent = t; m.hidden = !t; }

async function add(files) {
  const chosen = Array.from(files || []);
  const valid = chosen.filter(f => f.type.startsWith('image/'));
  if (!valid.length) { showMsg(chosen.length ? 'Please choose JPG, PNG or WebP images.' : ''); file.value = ''; return; }
  showMsg('');
  for (const f of valid) {
    const url = URL.createObjectURL(f);
    const el = new Image();
    try { await new Promise((res, rej) => { el.onload = res; el.onerror = rej; el.src = url; }); }
    catch (e) { URL.revokeObjectURL(url); showMsg('Could not open ' + f.name + '. Try another image.'); continue; }
    const it = { file: f, url, el, w: el.naturalWidth, h: el.naturalHeight, outUrl: null };
    const btn = document.createElement('button');
    btn.className = 'th';
    const im = document.createElement('img');
    im.src = url; im.alt = f.name;
    btn.appendChild(im);
    btn.addEventListener('click', () => select(it));
    it.thumb = btn;
    strip.appendChild(btn);
    items.push(it);
    if (!cur) select(it);
  }
  file.value = '';
}

async function select(it) {
  cur = it;
  document.querySelectorAll('.th').forEach(t => t.classList.remove('on'));
  it.thumb.classList.add('on');
  ws.hidden = false;
  $('#imgOriginal').src = it.url;
  inW.value = it.w; inH.value = it.h;
  await run(it);
}

function dims(it) {
  if (mode === 'pct') {
    const p = scale.value / 100;
    return [Math.max(1, Math.round(it.w * p)), Math.max(1, Math.round(it.h * p))];
  }
  let W = parseInt(inW.value, 10) || 0, H = parseInt(inH.value, 10) || 0;
  if (lock.checked) {
    if (W) H = Math.max(1, Math.round(W * it.h / it.w));
    else if (H) W = Math.max(1, Math.round(H * it.w / it.h));
    else { W = it.w; H = it.h; }
  } else {
    if (!W) W = it.w;
    if (!H) H = it.h;
  }
  return [W, H];
}

async function run(it) {
  busy.hidden = false;
  try {
    const [w, h] = dims(it);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    if (fmt === 'image/jpeg') { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); }
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(it.el, 0, 0, w, h);
    const blob = await new Promise((res, rej) =>
      c.toBlob(b => b ? res(b) : rej(new Error('fail')), fmt, fmt === 'image/png' ? undefined : q.value / 100));
    const sameSize = w === it.w && h === it.h;
    const useOrig = sameSize && blob.size >= it.file.size && it.file.type === fmt;
    if (it.outUrl) URL.revokeObjectURL(it.outUrl);
    it.blob = useOrig ? it.file : blob;
    it.type = useOrig ? it.file.type : fmt;
    it.outUrl = URL.createObjectURL(it.blob);
    it.cw = w; it.ch = h;
    imgResult.src = it.outUrl;
    showMsg('');
    stats(it);
  } catch (e) {
    $('#sNew').textContent = '-';
    showMsg('Could not process this image. Try a different format or size.');
  } finally {
    busy.hidden = true;
  }
}

function stats(it) {
  const ratio = it.blob.size / it.file.size;
  const saved = Math.round((1 - ratio) * 100);
  $('#sOrig').textContent = fb(it.file.size);
  $('#sNew').textContent = fb(it.blob.size);
  $('#sSaved').textContent = saved >= 0 ? saved + '%' : '+' + Math.abs(saved) + '%';
  $('#bar').style.width = Math.max(4, Math.min(100, ratio * 100)) + '%';
  $('#dims').textContent = it.w + '×' + it.h + ' → ' + it.cw + '×' + it.ch + ' px';
  const base = it.file.name.replace(/\.[^.]+$/, '');
  const dl = $('#dl');
  dl.href = it.outUrl;
  dl.download = base + '-' + it.cw + 'x' + it.ch + '.' + (EXT[it.type] || 'img');
}

function setPos(clientX) {
  const r = cmp.getBoundingClientRect();
  let p = (clientX - r.left) / r.width * 100;
  p = Math.max(0, Math.min(100, p));
  imgResult.style.clipPath = 'inset(0 0 0 ' + p + '%)';
  handle.style.left = p + '%';
}
let dragging = false;
cmp.addEventListener('pointerdown', e => { dragging = true; cmp.setPointerCapture(e.pointerId); setPos(e.clientX); });
cmp.addEventListener('pointermove', e => { if (dragging) setPos(e.clientX); });
['pointerup','pointercancel'].forEach(ev => cmp.addEventListener(ev, () => dragging = false));

function refresh() { clearTimeout(timer); timer = setTimeout(() => cur && run(cur), 150); }

scale.addEventListener('input', () => { $('#scaleLbl').textContent = scale.value + '%'; refresh(); });
q.addEventListener('input', () => { $('#qv').textContent = q.value; refresh(); });

inW.addEventListener('input', () => {
  if (cur && lock.checked && inW.value) inH.value = Math.max(1, Math.round(inW.value * cur.h / cur.w));
  refresh();
});
inH.addEventListener('input', () => {
  if (cur && lock.checked && inH.value) inW.value = Math.max(1, Math.round(inH.value * cur.w / cur.h));
  refresh();
});
lock.addEventListener('change', () => { if (cur && lock.checked) inH.value = Math.max(1, Math.round(inW.value * cur.h / cur.w)); refresh(); });

document.querySelectorAll('#modeSeg button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#modeSeg button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  mode = b.dataset.m;
  $('#pctBox').hidden = mode !== 'pct';
  $('#pxBox').hidden = mode !== 'px';
  if (cur && mode === 'px') { inW.value = cur.w; inH.value = cur.h; }
  refresh();
}));

document.querySelectorAll('#fmtSeg button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#fmtSeg button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  fmt = b.dataset.f;
  q.disabled = fmt === 'image/png';
  q.style.opacity = fmt === 'image/png' ? '.4' : '1';
  refresh();
}));
</script>
</body>
</html>
